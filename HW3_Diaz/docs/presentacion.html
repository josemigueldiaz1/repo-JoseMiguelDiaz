<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HW3 — Diagramas del pipeline</title>
<!-- Mermaid local: la presentacion funciona sin internet. -->
<script src="mermaid.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: #f5f7fa; color: #16202b; overflow: hidden;
  }
  .slide {
    display: none; height: 100vh; padding: 2rem 3rem 4.4rem;
    flex-direction: column;
  }
  .slide.activa { display: flex; }
  h2 {
    margin: 0 0 1rem; font-size: 1.85rem; color: #1f4e79; font-weight: 600;
    border-bottom: 3px solid #1f4e79; padding-bottom: .55rem; flex: 0 0 auto;
  }
  .lienzo {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    min-height: 0; overflow: auto;
  }
  .lienzo svg { max-width: 100%; max-height: 100%; height: auto; }
  .fallo {
    background: #fff3f3; border-left: 5px solid #c0392b; padding: 1rem 1.3rem;
    max-width: 60rem; font-size: .95rem;
  }
  .fallo h3 { margin: 0 0 .5rem; color: #c0392b; font-size: 1.05rem; }
  .fallo pre {
    background: #fff; border: 1px solid #ddd; padding: .7rem; overflow-x: auto;
    font-size: .82rem; line-height: 1.35;
  }
  .barra {
    position: fixed; bottom: 0; left: 0; right: 0; height: 3.2rem;
    background: #1f4e79; color: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 0 1.5rem; font-size: .9rem;
  }
  .barra button {
    background: rgba(255,255,255,.16); color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 5px;
    padding: .35rem .9rem; cursor: pointer; font-size: .9rem; margin-left: .4rem;
  }
  .barra button:hover { background: rgba(255,255,255,.32); }
</style>
</head>
<body>
<div id="slides"></div>
<div class="barra">
  <span style="opacity:.85">← →  cambiar  ·  F  pantalla completa  ·  Inicio  volver al primero</span>
  <span>
    <span id="contador"></span>
    <button onclick="mover(-1)">Anterior</button>
    <button onclick="mover(1)">Siguiente</button>
    <button onclick="pantallaCompleta()">Pantalla completa</button>
  </span>
</div>

<script>
const DIAGRAMAS = [
 {
  "titulo": "1. El problema, en un diagrama",
  "src": "flowchart LR\n    M[\"MYPE peruana<br/>quiere venderle<br/>al Estado\"] --> P1[\"No entiende<br/>las reglas\"]\n    M --> P2[\"No ve las<br/>oportunidades\"]\n    P1 --> S1[\"TAREA 1<br/>¿Qué dice la ley?\"]\n    P2 --> S2[\"TAREA 2<br/>¿Qué compra el Estado<br/>y dónde?\"]\n    S1 --> R[\"Un mismo motor RAG<br/>responde las dos\"]\n    S2 --> R"
 },
 {
  "titulo": "2. Tarea 1 — Lo que pasa UNA VEZ (proceso offline)",
  "src": "flowchart TD\n    A1[\"Ley 32069<br/>63 páginas · gob.pe\"] --> B\n    A2[\"DS 001-2026-EF<br/>16 páginas · El Peruano\"] --> B\n    B[\"COMPROBACIÓN DE FUENTES<br/>¿cuántas páginas?<br/>¿cuántos caracteres por página?<br/>¿hay páginas sin texto?<br/>¿el orden de lectura es correcto?\"]\n    B -->|alguna NO es usable| STOP([\"Se detiene.<br/>Se declara en el README.\"])\n    B -->|las dos son usables| C\n\n    C[\"EXTRACCIÓN PÁGINA A PÁGINA<br/>cada trozo de texto nace<br/>con su número de página pegado\"]\n    C --> D[\"LIMPIEZA<br/>quitar cabeceras de El Peruano<br/>unir palabras partidas por guion\"]\n    D --> E[\"TROCEADO POR PÁGINA<br/>900 caracteres · solape 150<br/>ID = documento + página + hash\"]\n    E --> F[\"EMBEDDINGS LOCALES<br/>multilingual-e5-small en CPU<br/>prefijo passage:\"]\n    F --> G[(\"ChromaDB<br/>511 fragmentos<br/>persistido en disco\")]"
 },
 {
  "titulo": "3. Tarea 1 — Lo que pasa en CADA PREGUNTA (proceso online)",
  "src": "flowchart TD\n    Q[\"Pregunta del usuario\"] --> R[\"Embedding de la consulta<br/>prefijo query:\"]\n    R --> S[\"Buscar los 5 fragmentos<br/>más parecidos en ChromaDB\"]\n    S --> T{{\"FILTRO 1 — GRATIS<br/>¿la mejor similitud<br/>llega a 0.82?\"}}\n\n    T -->|NO| U[\"SE ABSTIENE<br/>0 tokens · $0.00<br/>nunca se llamó a la API\"]\n    T -->|SÍ| V[\"Montar el contexto:<br/>cada fragmento etiquetado<br/>con su documento y página\"]\n\n    V --> W[\"DeepSeek · temperatura 0<br/>respuesta obligada en JSON\"]\n    W --> X{{\"FILTRO 2 — CUESTA<br/>¿el modelo dice<br/>puede_responder = true?\"}}\n\n    X -->|false| Y[\"SE ABSTIENE<br/>explicando qué SÍ cubre<br/>el corpus\"]\n    X -->|true| Z[\"RESPUESTA<br/>citando documento y página\"]\n    Z --> AA{{\"¿alguna fuente es<br/>norma modificatoria?\"}}\n    AA -->|sí| AB[\"+ nota de versión\"]\n    AA -->|no| AC[\"Entregar\"]\n    AB --> AC"
 },
 {
  "titulo": "4. Tarea 2 — De un portal sin enlaces a 20,422 procesos",
  "src": "flowchart TD\n    A[\"Portal de contrataciones abiertas<br/>Las 3 URLs devuelven el MISMO<br/>HTML de 2,837 bytes\"] --> B{{\"¿Por qué?\"}}\n    B --> C[\"Es una SPA de Angular:<br/>el contenido lo construye<br/>JavaScript en el navegador\"]\n    C --> D[\"Opción A: automatizar un navegador<br/>~300 MB, lento, frágil<br/>DESCARTADA\"]\n    C --> E[\"Opción B: buscar la API<br/>que usa la propia página\"]\n    E --> F[\"Descargar main.js<br/>3.2 millones de caracteres<br/>y buscar rutas con regex\"]\n    F --> G[\"/api/v1/files<br/>/api/v1/file/:fuente/:formato/:año/:mes<br/>/api/v1/releases · /api/v1/record/:ocid\"]\n    G --> H[\"3 ZIP mensuales<br/>26.5 MB · 5 peticiones HTTP\"]"
 },
 {
  "titulo": "5. Tarea 2 — OCDS: release, record y ocid",
  "src": "flowchart LR\n    O[\"ocid<br/>ocds-dgv273-seacev3-1251159<br/><i>identifica el PROCESO entero</i>\"]\n    O --> R1[\"release 1<br/>se convocó\"]\n    O --> R2[\"release 2<br/>se adjudicó\"]\n    O --> R3[\"release 3<br/>se firmó el contrato\"]\n    R1 --> C[\"record / compiled release<br/><b>la foto de HOY</b>\"]\n    R2 --> C\n    R3 --> C\n    C --> D[\"Registros.csv<br/>UNA fila por proceso\"]"
 },
 {
  "titulo": "6. Tarea 2 — La cascada territorial",
  "src": "flowchart TD\n    A[\"20,422 procesos\"] --> B{{\"1 · ¿El comprador declara<br/>su Departamento?\"}}\n    B -->|sí| OK1[\"✓ campo_departamento\"]\n    B -->|no| C{{\"2 · ¿Declara Región?\"}}\n    C -->|sí| OK2[\"✓ campo_region\"]\n    C -->|no| D{{\"3 · ¿Esa MISMA entidad declaró<br/>su departamento en otro proceso?\"}}\n    D -->|sí| OK3[\"✓ imputado_por_entidad<br/><i>no se inventa: se propaga<br/>un dato de la propia entidad</i>\"]\n    D -->|no| E{{\"4 · ¿La Localidad se parece<br/>a algún departamento, con score ≥88?\"}}\n    E -->|sí| OK4[\"✓ fuzzy_localidad\"]\n    E -->|no| F[\"NO_LOCALIZADO<br/><i>se etiqueta, NO se borra</i>\"]"
 },
 {
  "titulo": "7. Tarea 2 — La consulta híbrida",
  "src": "flowchart TD\n    Q[\"«obras de agua y saneamiento<br/>en Cusco por más de un millón»\"] --> SPLIT{{\"Tres condiciones<br/>de naturaleza distinta\"}}\n\n    SPLIT --> S[\"SEMÁNTICA<br/>«obras de agua y saneamiento»<br/><i>no hay columna que diga eso;<br/>hay mil formas de decirlo</i>\"]\n    SPLIT --> N[\"NUMÉRICA<br/>«más de un millón»<br/><i>900,000 se parece pero NO cumple</i>\"]\n    SPLIT --> T[\"TERRITORIAL<br/>«en Cusco»<br/><i>es atributo del comprador,<br/>no del texto</i>\"]\n\n    N --> FIL[\"FILTROS EXACTOS<br/>monto ≥ 1,000,000<br/>departamento = CUSCO\"]\n    T --> FIL\n    FIL --> UNI[\"Universo acotado\"]\n\n    S --> EMB[\"EMBEDDINGS<br/>ordenar por significado\"]\n    UNI --> EMB\n    EMB --> RES[\"Top-k procesos<br/>citados por su ocid\"]"
 },
 {
  "titulo": "8. Cómo se conectan las dos tareas (innovación)",
  "src": "flowchart LR\n    U[\"La MYPE pregunta al radar:<br/>«obras de saneamiento en Cusco»\"] --> T2[\"TAREA 2<br/>encuentra el proceso<br/>ocid · 2.1M PEN<br/>método: Adjudicación Simplificada\"]\n    T2 --> BTN[\"Botón:<br/>«¿Qué dice la ley sobre<br/>Adjudicación Simplificada?»\"]\n    BTN --> T1[\"TAREA 1<br/>llama a motor.responder<br/><b>el MISMO motor</b>\"]\n    T1 --> ANS[\"Qué dice la Ley,<br/>citando artículo y página\"]"
 }
];

mermaid.initialize({
  startOnLoad: false,
  theme: "base",
  themeVariables: {
    primaryColor: "#e7f0f9", primaryTextColor: "#12314c",
    primaryBorderColor: "#1f4e79", lineColor: "#4a5c6e",
    fontSize: "15px", fontFamily: "Segoe UI, system-ui, sans-serif"
  },
  flowchart: { curve: "basis", useMaxWidth: true, htmlLabels: true }
});

const cont = document.getElementById("slides");

// Se renderiza cada diagrama por separado. Si uno falla, la diapositiva muestra el
// error y el codigo fuente en vez de quedarse en blanco: un fallo que no se ve no se
// puede corregir.
(async () => {
  for (let i = 0; i < DIAGRAMAS.length; i++) {
    const d = DIAGRAMAS[i];
    const sec = document.createElement("section");
    sec.className = "slide";

    const h = document.createElement("h2");
    h.textContent = d.titulo;
    sec.appendChild(h);

    const lienzo = document.createElement("div");
    lienzo.className = "lienzo";
    sec.appendChild(lienzo);
    cont.appendChild(sec);

    try {
      const { svg } = await mermaid.render("dia" + i, d.src);
      lienzo.innerHTML = svg;
    } catch (e) {
      lienzo.innerHTML =
        '<div class="fallo"><h3>Este diagrama no se pudo dibujar</h3>' +
        '<p><strong>Error:</strong> ' + String(e && e.message ? e.message : e) + '</p>' +
        '<p>Codigo fuente del diagrama:</p><pre></pre></div>';
      lienzo.querySelector("pre").textContent = d.src;
    }
  }
  mostrar(0);
})();

let actual = 0;
function slides() { return document.querySelectorAll(".slide"); }
function mostrar(i) {
  const s = slides();
  if (!s.length) return;
  actual = Math.max(0, Math.min(i, s.length - 1));
  s.forEach((el, j) => el.classList.toggle("activa", j === actual));
  document.getElementById("contador").textContent = (actual + 1) + " / " + s.length;
}
function mover(d) { mostrar(actual + d); }
function pantallaCompleta() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); mover(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); mover(-1); }
  else if (e.key === "Home") mostrar(0);
  else if (e.key === "End") mostrar(slides().length - 1);
  else if (e.key.toLowerCase() === "f") pantallaCompleta();
});
</script>
</body>
</html>
